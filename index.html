<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dusit Transit-Match - ระบบหารค่ารถเด็กสวนดุสิต</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Dusit Transit-Match</h1>
            <p>ระบบจับคู่หารค่ารถออกจาก ม.สวนดุสิต</p>
        </header>

        <!-- ส่วนล็อกอินด้วยอีเมลมหาวิทยาลัย -->
        <section id="login-section" class="card">
            <h2>เข้าสู่ระบบ (สำหรับ นศ. สวนดุสิต)</h2>
            <form id="login-form">
                <input type="email" id="email-input" placeholder="example@mail.dusit.ac.th" required>
                <button type="submit">เข้าสู่ระบบ</button>
            </form>
            <p id="login-msg" class="error-msg"></p>
        </section>

        <!-- ส่วนระบบหลัก -->
        <main id="main-section" class="hidden">
            <div class="user-bar">
                <span>ยินดีต้อนรับ: <strong id="user-email"></strong></span>
                <button id="logout-btn" class="btn-secondary">ออกจากระบบ</button>
            </div>

            <!-- ฟอร์มสร้างปาร์ตี้เดินทาง -->
            <section class="card">
                <h3>สร้างปาร์ตี้เดินทางใหม่</h3>
                <form id="party-form">
                    <div class="form-group">
                        <label>จุดเริ่มต้น:</label>
                        <input type="text" id="origin" placeholder="ระบุจุดเริ่มต้น (เช่น หน้าตึก 11, ศูนย์อาหาร)" required>
                    </div>

                    <div class="form-group">
                        <label>จุดหมายปลายทาง:</label>
                        <input type="text" id="destination" placeholder="ระบุจุดหมายปลายทาง (เช่น MRT บางพลัด, BTS อนุสาวรีย์ชัยฯ)" required>
                    </div>

                    <div class="form-group">
                        <label>เวลาล้อหมุน:</label>
                        <input type="time" id="departure-time" required>
                    </div>

                    <div class="form-group">
                        <label>รับเพิ่มอีก (คน):</label>
                        <input type="number" id="seats" min="1" max="4" value="3" required>
                    </div>

                    <button type="submit" class="btn-success">สร้างปาร์ตี้</button>
                </form>
            </section>

            <!-- รายการปาร์ตี้ที่เปิดรับอยู่ -->
            <section class="card">
                <h3>ปาร์ตี้ที่กำลังหาคนหารค่ารถ</h3>
                <div id="party-list">
                    <!-- รายการปาร์ตี้จะถูกสร้างด้วย JS -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
